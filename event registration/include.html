<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Tech Fest Registration 2026</h1>

<form>
    <label for="name">Student Name</label><br>
    <input type="text" id="name"><br><br>

    <label for="email">email</label><br>
    <input type="email" id="email"><br><br>

    <label for="phone">Phone no</label><br>
    <input type="tel" id="phone"><br><br>

    <label for="department">Department</label><br>
    <select id="department">
        <option>cse</option>
        <option>ece</option>
        <option>civil</option>
        <option>mech</option>
    </select>
    <br><br>
    <label>Events</label><br>
    <input type="checkbox">Coding Competion <br>
    <input type="checkbox">Hackerthon <br>
    <input type="checkbox">Quiz <br>
    <input type="checkbox">paper presentation <br>

    <label>Remarks</label>
    <textarea rows="5" cols="40"></textarea>

    <br><br>
    <button type="submit">Register</button>
    

</form>
    
</body>
</html>
